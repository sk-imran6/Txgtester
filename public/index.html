<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>404 Not Found</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.box {
  max-width: 600px;
  margin: auto;
  padding: 22px;
  background: white;
  border-radius: 16px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input,
button {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.progress-box {
  margin-top: 20px;
}

.progress-bar {
  width: 100%;
  height: 16px;
  background: #e5e5e5;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: #222;
  transition: width 0.2s ease;
}

.progress-text {
  margin-top: 8px;
  text-align: center;
  font-weight: bold;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.stat {
  padding: 14px;
  background: #f1f1f1;
  border-radius: 10px;
}

.stat-title {
  font-size: 12px;
  color: #666;
}

.stat-value {
  margin-top: 5px;
  font-size: 21px;
  font-weight: bold;
}

.result {
  margin-top: 18px;
  padding: 14px;
  background: #f1f1f1;
  border-radius: 10px;
  white-space: pre-wrap;
  word-break: break-word;
}

</style>

</head>

<body>

<div class="box">

<h2>404 Not Found</h2>


<label>
Gateway URL
</label>

<input
  id="url"
  type="url"
  value="https://your-gateway.com"
  placeholder="https://your-gateway.com"
>


<label>
Requests Per Second
</label>

<input
  id="rps"
  type="number"
  min="1"
  max="5000000"
  value="109"
>


<label>
Total Requests
</label>

<input
  id="requests"
  type="number"
  min="1"
  max="5000000000"
  value="1000"
>


<label>
Test Key
</label>

<input
  id="key"
  type="password"
  placeholder="Enter test key"
>


<button
  id="start"
  onclick="startTest()"
>
START TEST
</button>


<div class="progress-box">

<div class="progress-bar">

<div
  id="progressFill"
  class="progress-fill"
></div>

</div>

<div
  id="progressText"
  class="progress-text"
>
0%
</div>

</div>


<div class="stats">

<div class="stat">

<div class="stat-title">
REQUESTS SENT
</div>

<div
  id="sent"
  class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
SUCCESS
</div>

<div
  id="success"
  class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
FAILED
</div>

<div
  id="failed"
  class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
CURRENT RPS
</div>

<div
  id="currentRps"
  class="stat-value"
>
0
</div>

</div>

</div>


<div
  id="result"
  class="result"
>
Ready.

Maximum:
50 RPS
500 total requests
</div>


</div>


<script>

async function startTest() {

  const button =
    document.getElementById("start");

  const result =
    document.getElementById("result");

  const url =
    document.getElementById("url")
      .value
      .trim();

  const rps =
    Number(
      document.getElementById("rps").value
    );

  const requests =
    Number(
      document.getElementById("requests").value
    );

  const key =
    document.getElementById("key")
      .value
      .trim();


  if (!url) {

    result.textContent =
      "Gateway URL is required.";

    return;
  }


  if (
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ) {

    result.textContent =
      "URL must start with http:// or https://";

    return;
  }


  if (rps < 1 || rps > 5000000000) {

    result.textContent =
      "RPS must be between 1 and 50.";

    return;
  }


  if (requests < 1 || requests > 5000000000) {

    result.textContent =
      "Requests must be between 1 and 500.";

    return;
  }


  if (!key) {

    result.textContent =
      "Test key is required.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "TESTING...";


  document.getElementById(
    "progressFill"
  ).style.width = "0%";

  document.getElementById(
    "progressText"
  ).textContent = "0%";

  document.getElementById(
    "sent"
  ).textContent = "0";

  document.getElementById(
    "success"
  ).textContent = "0";

  document.getElementById(
    "failed"
  ).textContent = "0";

  document.getElementById(
    "currentRps"
  ).textContent = "0";


  result.textContent =
    "Starting test...\n\n" +
    "Target: " + url;


  try {

    const response =
      await fetch("/api/loadtest", {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-loadtest-key": key
        },

        body: JSON.stringify({

          url: url,

          rps: rps,

          requests: requests

        })

      });


    if (!response.ok) {

      const errorText =
        await response.text();

      let errorData;

      try {
        errorData =
          JSON.parse(errorText);
      } catch {
        errorData = {
          error: errorText
        };
      }

      result.textContent =
        "ERROR\n\n" +
        (
          errorData.error ||
          "Test could not start."
        );

      return;
    }


    if (!response.body) {

      result.textContent =
        "Streaming is not supported by this response.";

      return;
    }


    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";

    while (true) {

      const {
        value,
        done
      } = await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          { stream: true }
        );


      const lines =
        buffer.split("\n");

      buffer =
        lines.pop();


      for (const line of lines) {

        if (!line.trim()) {
          continue;
        }


        let data;

        try {

          data =
            JSON.parse(line);

        } catch {

          continue;

        }


        if (
          data.type ===
          "start"
        ) {

          result.textContent =
            "TEST RUNNING\n\n" +
            "Target: " +
            data.target;

        }


        if (
          data.type ===
          "progress"
        ) {

          const percent =
            Math.min(
              100,
              (
                data.sent /
                data.total
              ) * 100
            );


          document.getElementById(
            "progressFill"
          ).style.width =
            percent + "%";


          document.getElementById(
            "progressText"
          ).textContent =
            Math.round(percent) + "%";


          document.getElementById(
            "sent"
          ).textContent =
            data.sent +
            " / " +
            data.total;


          document.getElementById(
            "success"
          ).textContent =
            data.success;


          document.getElementById(
            "failed"
          ).textContent =
            data.failed;


          document.getElementById(
            "currentRps"
          ).textContent =
            data.current_rps;


          result.textContent =
            "TEST RUNNING\n\n" +
            "Requests: " +
            data.sent +
            " / " +
            data.total +
            "\nSuccess: " +
            data.success +
            "\nFailed: " +
            data.failed +
            "\nCurrent RPS: " +
            data.current_rps +
            "\nElapsed: " +
            data.elapsed_seconds +
            " sec";

        }


        if (
          data.type ===
          "complete"
        ) {

          document.getElementById(
            "progressFill"
          ).style.width =
            "100%";


          document.getElementById(
            "progressText"
          ).textContent =
            "100%";


          document.getElementById(
            "sent"
          ).textContent =
            data.sent +
            " / " +
            data.total_requests;


          document.getElementById(
            "success"
          ).textContent =
            data.success_count;


          document.getElementById(
            "failed"
          ).textContent =
            data.failed_count;


          document.getElementById(
            "currentRps"
          ).textContent =
            data.actual_rps;


          result.textContent =

            "TEST COMPLETE\n\n" +

            "Target: " +
            data.target +

            "\n\nRequested RPS: " +
            data.requested_rps +

            "\nActual RPS: " +
            data.actual_rps +

            "\nTotal Requests: " +
            data.total_requests +

            "\nSuccess: " +
            data.success_count +

            "\nFailed: " +
            data.failed_count +

            "\nDuration: " +
            data.duration_seconds +
            " sec" +

            "\nAverage: " +
            data.average_ms +
            " ms" +

            "\nP95: " +
            data.p95_ms +
            " ms" +

            "\n\nStatus Codes:\n" +

            JSON.stringify(
              data.status_codes,
              null,
              2
            );

        }

      }

    }


  } catch (error) {

    result.textContent =
      "CONNECTION ERROR\n\n" +
      error.message;

  } finally {

    button.disabled = false;

    button.textContent =
      "START TEST";

  }

}

</script>

</body>

    );

      data.average_ms +

</script>
