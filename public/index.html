<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>TXG Gateway RPS Tester</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.box {
  max-width: 600px;
  margin: auto;
  padding: 22px;
  background: white;
  border-radius: 16px;
}

input,
button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  box-sizing: border-box;
}

button {
  margin-top: 18px;
  font-weight: bold;
  cursor: pointer;
}

.target,
.result {
  margin-top: 15px;
  padding: 14px;
  background: #f1f1f1;
  border-radius: 10px;
  word-break: break-word;
}

.result {
  white-space: pre-wrap;
}

.gateway-url {
  margin-top: 20px;
}

</style>

</head>

<body>

<div class="box">

<h2>TXG Gateway RPS Tester</h2>

<label>
Requests per second
</label>

<input
  id="rps"
  type="number"
  min="1"
  max="50000000000"
  value="100000000000"
  placeholder="Example: 21"
/>

<label>
Total requests
</label>

<input
  id="requests"
  type="number"
  min="1"
  max="50000000000"
  value="100000000000"
  placeholder="Example: 500"
/>

<label>
Test Key
</label>

<input
  id="key"
  type="password"
  placeholder="Enter test key"
/>

<button
  id="start"
  onclick="startTest()"
>
START TEST
</button>

<div
  id="result"
  class="result"
>
Ready.

Maximum:
50 RPS
500 total requests
</div>


<!-- ============================= -->
<!-- GATEWAY URL - BOTTOM -->
<!-- ============================= -->

<div class="gateway-url">

<label>
<b>Gateway URL</b>
</label>

<input
  id="url"
  type="url"
  placeholder="https://your-gateway.com"
  value="https://your-gateway.com"
/>

</div>


</div>

<script>

async function startTest() {

  const button =
    document.getElementById("start");

  const result =
    document.getElementById("result");

  const rps =
    Number(
      document.getElementById("rps").value
    );

  const requests =
    Number(
      document.getElementById("requests").value
    );

  const key =
    document.getElementById("key").value.trim();

  const url =
    document.getElementById("url").value.trim();


  if (rps < 1 || rps > 100000000000) {

    result.textContent =
      "RPS must be between 1 and 50.";

    return;
  }


  if (requests < 1 || requests > 5000000) {

    result.textContent =
      "Total requests must be between 1 and 500.";

    return;
  }


  if (!key) {

    result.textContent =
      "Enter your test key.";

    return;
  }


  if (!url) {

    result.textContent =
      "Enter Gateway URL.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "TESTING...";


  result.textContent =
    "Test running...\n\n" +
    "URL: " + url + "\n" +
    "RPS: " + rps + "\n" +
    "Total: " + requests;


  try {

    const response =
      await fetch("/api/loadtest", {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-loadtest-key": key
        },

        body: JSON.stringify({
          url: url,
          rps: rps,
          requests: requests
        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      result.textContent =
        "ERROR\n\n" +
        (data.error || "Unknown error");

      return;
    }


    result.textContent =

      "TEST COMPLETE\n\n" +

      "Target: " +
      data.target +

      "\nRequested RPS: " +
      data.requested_rps +

      "\nActual RPS: " +
      data.actual_rps +

      "\nTotal Requests: " +
      data.total_requests +

      "\nSuccess: " +
      data.success_count +

      "\nFailed: " +
      data.failed_count +

      "\nDuration: " +
      data.duration_seconds +
      " sec" +

      "\nAverage: " +
      data.average_ms +
      " ms" +

      "\nP95: " +
      data.p95_ms +
      " ms" +

      "\n\nStatus Codes:\n" +

      JSON.stringify(
        data.status_codes,
        null,
        2
      );


  } catch (error) {

    result.textContent =
      "CONNECTION ERROR\n\n" +
      error.message;

  } finally {

    button.disabled = false;

    button.textContent =
      "START TEST";
  }
}

</script>

</body>

</html><button
  id="start"
  onclick="startTest()"
>

</button>

<div

500 total requests

</div>

</body>

</html>
