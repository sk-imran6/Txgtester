<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>TXG Gateway Tester</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.box {
  max-width: 600px;
  margin: auto;
  padding: 22px;
  background: white;
  border-radius: 16px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input,
button {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.result {
  margin-top: 18px;
  padding: 14px;
  background: #f1f1f1;
  border-radius: 10px;
  white-space: pre-wrap;
  word-break: break-word;
}

</style>

</head>

<body>

<div class="box">

<h2>TXG Gateway Tester</h2>


<label>
Gateway URL
</label>

<input
  id="url"
  type="url"
  value="https://your-gateway.com"
  placeholder="https://your-gateway.com"
>


<label>
Requests Per Second
</label>

<input
  id="rps"
  type="number"
  min="1"
  max="100000000000"
  value="10"
>


<label>
Total Requests
</label>

<input
  id="requests"
  type="number"
  min="1"
  max="50000000000"
  value="100"
>


<label>
Test Key
</label>

<input
  id="key"
  type="password"
  placeholder="Enter test key"
>


<button
  id="start"
  onclick="startTest()"
>
START TEST
</button>


<div
  id="result"
  class="result"
>
Ready.

Maximum:
50 RPS
500 total requests
</div>


</div>


<script>

async function startTest() {

  const button =
    document.getElementById("start");

  const result =
    document.getElementById("result");

  const url =
    document.getElementById("url").value.trim();

  const rps =
    Number(
      document.getElementById("rps").value
    );

  const requests =
    Number(
      document.getElementById("requests").value
    );

  const key =
    document.getElementById("key").value.trim();


  if (!url) {

    result.textContent =
      "Gateway URL is required.";

    return;
  }


  if (
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ) {

    result.textContent =
      "URL must start with http:// or https://";

    return;
  }


  if (rps < 1 || rps > 100000000000) {

    result.textContent =
      "RPS must be between 1 and 50.";

    return;
  }


  if (requests < 1 || requests > 100000000000) {

    result.textContent =
      "Requests must be between 1 and 500.";

    return;
  }


  if (!key) {

    result.textContent =
      "Test key is required.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "TESTING...";


  result.textContent =
    "Test running...\n\n" +
    "URL: " + url + "\n" +
    "RPS: " + rps + "\n" +
    "Requests: " + requests;


  try {

    const response =
      await fetch("/api/loadtest", {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-loadtest-key": key
        },

        body: JSON.stringify({
          url: url,
          rps: rps,
          requests: requests
        })

      });


    const text =
      await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      data = {
        error: text || "Invalid server response"
      };
    }


    if (!response.ok) {

      result.textContent =
        "ERROR\n\n" +
        (data.error || "Unknown error");

      return;
    }


    result.textContent =

      "TEST COMPLETE\n\n" +

      "Target: " +
      data.target +

      "\n\nRequested RPS: " +
      data.requested_rps +

      "\nActual RPS: " +
      data.actual_rps +

      "\nTotal Requests: " +
      data.total_requests +

      "\nSuccess: " +
      data.success_count +

      "\nFailed: " +
      data.failed_count +

      "\nDuration: " +
      data.duration_seconds +
      " sec" +

      "\nAverage: " +
      data.average_ms +
      " ms" +

      "\nP95: " +
      data.p95_ms +
      " ms" +

      "\n\nStatus Codes:\n" +

      JSON.stringify(
        data.status_codes,
        null,
        2
      );

  } catch (error) {

    result.textContent =
      "CONNECTION ERROR\n\n" +
      error.message;

  } finally {

    button.disabled = false;

    button.textContent =
      "START TEST";

  }

}

</script>

</body>

</html>
